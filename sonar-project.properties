sonar.projectKey=stephenlclarke_container
sonar.organization=stephenlclarke
sonar.projectName=container
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/.build/**,**/*.pb.swift,**/*.grpc.swift
sonar.test.inclusions=Tests/**/*.swift
sonar.coverageReportPaths=coverage.xml

# kindnet is a node CNI: host networking and NET_ADMIN/NET_RAW are its job,
# not optional application privileges. Storage remains bounded separately.
sonar.issue.ignore.multicriteria=kindnetHostNamespace,kindnetCapabilities
sonar.issue.ignore.multicriteria.kindnetHostNamespace.ruleKey=kubernetes:S6431
sonar.issue.ignore.multicriteria.kindnetHostNamespace.resourceKey=Sources/Plugins/K8s/Resources/kindnet.yaml
sonar.issue.ignore.multicriteria.kindnetCapabilities.ruleKey=kubernetes:S5849
sonar.issue.ignore.multicriteria.kindnetCapabilities.resourceKey=Sources/Plugins/K8s/Resources/kindnet.yaml
