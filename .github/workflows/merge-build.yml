name: container project - merge build

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: merge-build-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
    steps:
      - name: Checkout for push diff
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/changed-files.txt"
          before="${{ github.event.before }}"
          after="${GITHUB_SHA}"
          if [[ "$before" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$after" > "$changed_files"
          else
            git diff --name-only "$before" "$after" > "$changed_files"
          fi

          python3 scripts/classify-build-inputs.py "$changed_files" >> "$GITHUB_OUTPUT"

  verify-builder-shim-contract:
    name: Verify builder-shim runtime contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Verify pinned builder-shim arguments
        run: scripts/validate-builder-shim-contract.sh

  build:
    name: Invoke build
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/common.yml
    with:
      release: true
      check_protobuf: ${{ needs.changes.outputs.protobuf == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
