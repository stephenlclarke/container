name: Container-only Bazel qualification

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-only-local-qualification
  cancel-in-progress: false

jobs:
  qualify:
    # A maintainer must explicitly label a same-repository PR. Fork code never
    # is admitted automatically. Repository settings separately require
    # approval for every outside contributor; never approve untrusted work
    # targeting this persistent machine. A PR can edit its own YAML guards.
    if: >-
      github.repository == 'stephenlclarke/container' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.label.name == 'container-only-qualification' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Enroll only the designated MacBook Pro with this label. Its local
    # preflight verifies the SSD, signing identity and credential profile.
    runs-on: [self-hosted, macOS, ARM64, container-only]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind the named branch to the requested revision
        shell: bash
        env:
          REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REQUESTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF_TYPE" = branch
          git switch --force-create "$REQUESTED_BRANCH" "$REQUESTED_REVISION"
          test "$(git rev-parse HEAD)" = "$REQUESTED_REVISION"
      - name: Run the same local qualification command
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          evidence="$HOME/Library/Application Support/ContainerFamily/retained/container-only/ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'QUALIFICATION_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          make bazel-unattended QUALIFICATION_EVIDENCE="$evidence"
      - name: Retain the qualification outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.QUALIFICATION_EVIDENCE }}/QUALIFICATION.md
            ${{ env.QUALIFICATION_EVIDENCE }}/qualification.json
            ${{ env.QUALIFICATION_EVIDENCE }}/acceptance.json
            ${{ env.QUALIFICATION_EVIDENCE }}/preflight.json
            ${{ env.QUALIFICATION_EVIDENCE }}/host-lease.json
            ${{ env.QUALIFICATION_EVIDENCE }}/BENCHMARK.md
            ${{ env.QUALIFICATION_EVIDENCE }}/runtime-comparison.json
            ${{ env.QUALIFICATION_EVIDENCE }}/components/matrix.*
            ${{ env.QUALIFICATION_EVIDENCE }}/components/comparison-review.json
            ${{ env.QUALIFICATION_EVIDENCE }}/coverage/coverage-summary.json
            ${{ env.QUALIFICATION_EVIDENCE }}/integration/coverage/coverage-summary.json
            ${{ env.QUALIFICATION_EVIDENCE }}/combined-coverage/coverage-summary.json
            ${{ env.QUALIFICATION_EVIDENCE }}/quality/quality.json
          if-no-files-found: warn
