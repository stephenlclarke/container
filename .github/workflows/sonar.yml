name: SonarQube

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Only same-repository PRs receive analysis credentials. Heavy runtime,
    # benchmark and release qualification remains a separate local authority.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the analysis revision
        run: |
          set -euo pipefail
          [[ "$ANALYSIS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SHA"

      - name: Test workflow helpers
        run: python3 -m unittest discover -s Tools/bazel -p 'test_*.py'

      - name: Verify native Swift architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          /usr/bin/swift --version | tee swift-toolchain.txt
          grep -q 'Target: arm64-apple-macosx' swift-toolchain.txt

      - name: Generate unit coverage
        env:
          SWIFT_TEST_FLAGS: --no-parallel
        run: make coverage-sonar

      - name: Validate SonarQube project policy
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
            'https://sonarcloud.io/api/settings/values?component=stephenlclarke_container&keys=sonar.leak.period,sonar.leak.period.type')"
          jq -e '
            ([.settings[] | select(.key == "sonar.leak.period") | .value] == ["previous_version"])
            and ([.settings[] | select(.key == "sonar.leak.period.type") | .value] == ["previous_version"])
          ' <<< "${settings}" >/dev/null

      - name: Analyze pull request
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.event.pull_request.head.sha }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.qualitygate.wait=true

      - name: Analyze branch
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true

      - name: Require clean Sonar issues and hotspots
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          context=()
          scope=()
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            context+=(--data-urlencode 'pullRequest=${{ github.event.pull_request.number }}')
            scope+=(--data-urlencode 'inNewCodePeriod=true')
          else
            context+=(--data-urlencode "branch=${GITHUB_REF_NAME}")
          fi
          if ((${#scope[@]})); then
            issues="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'componentKeys=stephenlclarke_container' \
              --data-urlencode 'resolved=false' --data-urlencode 'ps=1' \
              "${scope[@]}" "${context[@]}" https://sonarcloud.io/api/issues/search)"
            hotspots="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'projectKey=stephenlclarke_container' \
              --data-urlencode 'status=TO_REVIEW' --data-urlencode 'ps=1' \
              "${scope[@]}" "${context[@]}" https://sonarcloud.io/api/hotspots/search)"
          else
            issues="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'componentKeys=stephenlclarke_container' \
              --data-urlencode 'resolved=false' --data-urlencode 'ps=1' \
              "${context[@]}" https://sonarcloud.io/api/issues/search)"
            hotspots="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'projectKey=stephenlclarke_container' \
              --data-urlencode 'status=TO_REVIEW' --data-urlencode 'ps=1' \
              "${context[@]}" https://sonarcloud.io/api/hotspots/search)"
          fi
          jq -e '.total == 0' <<< "${issues}" >/dev/null
          jq -e '.paging.total == 0' <<< "${hotspots}" >/dev/null

      - name: Upload unit coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-${{ env.ANALYSIS_SHA }}
          path: |
            coverage-reports/unit/coverage.lcov
            coverage.xml
            .scannerwork/report-task.txt
            swift-toolchain.txt
          include-hidden-files: true
          if-no-files-found: error

  codeql:
    name: Analyze CodeQL
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the analysis revision and runner
        run: |
          set -euo pipefail
          [[ "$ANALYSIS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SHA"
          test "$(uname -m)" = arm64
          git ls-files Sources | grep '\.swift$' | sort > codeql-source-inventory.txt
          test -s codeql-source-inventory.txt
          wc -l codeql-source-inventory.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      - name: Build all production products for CodeQL
        run: |
          set -euo pipefail
          /usr/bin/swift --version | tee swift-toolchain.txt
          test ! -e "$RUNNER_TEMP/codeql-swift-build"
          # A new scratch directory ensures every product compiles under tracing.
          # --build-tests would also trace thousands of dependency/test actions.
          /usr/bin/swift build --arch arm64 -c debug -Xswiftc -warnings-as-errors \
            --scratch-path "$RUNNER_TEMP/codeql-swift-build"

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"
          output: codeql-results
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ env.ANALYSIS_SHA }}
          wait-for-processing: true

      - name: Require successful CodeQL analysis with zero findings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path('codeql-results').glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL did not produce a SARIF report')
          for path in reports:
              runs = json.loads(path.read_text()).get('runs')
              if not isinstance(runs, list) or not runs:
                  raise SystemExit(f'CodeQL report has no analysis runs: {path}')
              for run in runs:
                  invocations = run.get('invocations')
                  if not isinstance(invocations, list) or not invocations or any(
                      invocation.get('executionSuccessful') is not True for invocation in invocations
                  ):
                      raise SystemExit(f'CodeQL analysis was incomplete: {path}')
                  results = run.get('results', [])
                  if not isinstance(results, list) or results:
                      raise SystemExit(f'CodeQL requires zero findings: {path}')
          print(f'CodeQL completed with zero findings in {len(reports)} report(s)')
          PY

      - name: Upload CodeQL analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-analysis-${{ env.ANALYSIS_SHA }}
          path: |
            codeql-results/*.sarif
            codeql-source-inventory.txt
            swift-toolchain.txt
          if-no-files-found: error
