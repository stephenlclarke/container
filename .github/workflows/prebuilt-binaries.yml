name: Prebuilt Binaries

on:
  push:
    branches:
      - main
      - release
      - "release-*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: prebuilt-binaries-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout for push diff
        if: github.event_name == 'push'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            printf 'heavy=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          before="${{ github.event.before }}"
          after="${GITHUB_SHA}"
          if [[ "$before" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$after" > "$changed_files"
          else
            git diff --name-only "$before" "$after" > "$changed_files"
          fi

          heavy=false
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|Formula/*)
                ;;
              *)
                heavy=true
                break
                ;;
            esac
          done < "$changed_files"

          printf 'heavy=%s\n' "$heavy" >> "$GITHUB_OUTPUT"

  linux_service_workloads:
    name: Build Linux service workloads
    needs: changes
    if: >
      github.repository == 'stephenlclarke/container' &&
      needs.changes.outputs.heavy == 'true' &&
      (github.event_name != 'push' ||
       !startsWith(github.event.head_commit.message, 'chore(homebrew): refresh prebuilt formula metadata'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout container
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build pinned Linux service workloads
        env:
          CONTAINER_GELF_BUILDER: ${{ steps.buildx.outputs.name }}
          CONTAINER_JOURNALD_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          python3 Tools/ContainerJournaldService/build.py build \
            --output-directory .build/container-journald-service
          python3 Tools/ContainerGELFService/build.py build \
            --output-directory bin/services/container-gelf-service

      - name: Upload pinned Linux service workloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-service-workloads
          path: |
            .build/container-journald-service
            bin/services/container-gelf-service
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  package:
    name: Package ${{ github.ref_name }}
    needs:
      - changes
      - linux_service_workloads
    if: >
      github.repository == 'stephenlclarke/container' &&
      needs.changes.outputs.heavy == 'true' &&
      needs.linux_service_workloads.result == 'success' &&
      (github.event_name != 'push' ||
       !startsWith(github.event.head_commit.message, 'chore(homebrew): refresh prebuilt formula metadata'))
    runs-on: macos-26
    steps:
      - name: Checkout container
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download pinned Linux service workloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-service-workloads
          path: .

      - name: Select package lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          asset_slug="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA:0:12}"
          formula_slug="$(
            printf '%s' "$asset_slug" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          )"
          case "${GITHUB_REF_NAME}" in
            main)
              printf 'configuration=release\n' >> "$GITHUB_OUTPUT"
              printf 'asset=container-homebrew-main-release-arm64.tar.gz\n' >> "$GITHUB_OUTPUT"
              printf 'release_name=Homebrew main lane prebuilt\n' >> "$GITHUB_OUTPUT"
              printf 'formula=container.rb\n' >> "$GITHUB_OUTPUT"
              printf 'formula_class=Container\n' >> "$GITHUB_OUTPUT"
              printf 'label=main lane\n' >> "$GITHUB_OUTPUT"
              printf 'promote_to_tap=false\n' >> "$GITHUB_OUTPUT"
              ;;
            release)
              formula_class="$(python3 -c 'import re, sys; print("Container" + "".join(part.capitalize() for part in re.split(r"[^a-zA-Z0-9]+", sys.argv[1]) if part))' "$formula_slug")"
              printf 'configuration=release\n' >> "$GITHUB_OUTPUT"
              printf 'asset=container-homebrew-%s-release-arm64.tar.gz\n' "$asset_slug" >> "$GITHUB_OUTPUT"
              printf 'release_name=Homebrew release lane prebuilt\n' >> "$GITHUB_OUTPUT"
              printf 'formula=container-%s.rb\n' "$formula_slug" >> "$GITHUB_OUTPUT"
              printf 'formula_class=%s\n' "$formula_class" >> "$GITHUB_OUTPUT"
              printf 'label=release lane\n' >> "$GITHUB_OUTPUT"
              printf 'promote_to_tap=true\n' >> "$GITHUB_OUTPUT"
              ;;
            release-*)
              formula_class="$(python3 -c 'import re, sys; print("Container" + "".join(part.capitalize() for part in re.split(r"[^a-zA-Z0-9]+", sys.argv[1]) if part))' "$formula_slug")"
              printf 'configuration=release\n' >> "$GITHUB_OUTPUT"
              printf 'asset=container-homebrew-%s-release-arm64.tar.gz\n' "$asset_slug" >> "$GITHUB_OUTPUT"
              printf 'release_name=Homebrew %s branch prebuilt\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              printf 'formula=container-%s.rb\n' "$formula_slug" >> "$GITHUB_OUTPUT"
              printf 'formula_class=%s\n' "$formula_class" >> "$GITHUB_OUTPUT"
              printf 'label=%s branch\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              printf 'promote_to_tap=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Unsupported branch for prebuilt packaging: %s\n' "${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          {
            printf 'asset_slug=%s\n' "$asset_slug"
            printf 'tag=homebrew-%s-%s-%s\n' "$asset_slug" "${GITHUB_RUN_NUMBER}" "$short_sha"
            printf 'version=%s-release.%s.%s\n' "$asset_slug" "${GITHUB_RUN_NUMBER}" "$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install Developer ID application certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_KEYCHAIN: ${{ runner.temp }}/container-developer-id-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
          DEVELOPER_ID_ORIGINAL_KEYCHAINS: ${{ runner.temp }}/container-developer-id-${{ github.run_id }}-${{ github.run_attempt }}.keychains
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_APPLICATION_P12_BASE64}" ]]; then
            printf 'DEVELOPER_ID_APPLICATION_P12_BASE64 is required for release signing.\n' >&2
            exit 1
          fi
          if [[ -z "${DEVELOPER_ID_APPLICATION_P12_PASSWORD}" ]]; then
            printf 'DEVELOPER_ID_APPLICATION_P12_PASSWORD is required for release signing.\n' >&2
            exit 1
          fi

          certificate="${RUNNER_TEMP}/developer-id-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p12"
          signing_probe="${RUNNER_TEMP}/developer-id-signing-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keychain_password="$(openssl rand -hex 32)"
          restore_keychain_search_list() {
            local keychain
            local -a keychains=()
            if [[ -f "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}" ]]; then
              while IFS= read -r keychain; do
                keychain="${keychain#\"}"
                keychain="${keychain%\"}"
                [[ -n "${keychain}" ]] && keychains+=("${keychain}")
              done < "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
              if ((${#keychains[@]} > 0)); then
                security list-keychains -d user -s "${keychains[@]}"
              else
                security list-keychains -d user -s
              fi
            fi
          }
          cleanup_failed_import() {
            status="$?"
            rm -f "${certificate}" "${signing_probe}"
            if ((status != 0)); then
              restore_keychain_search_list >/dev/null 2>&1 || true
              security delete-keychain "${DEVELOPER_ID_KEYCHAIN}" >/dev/null 2>&1 || true
              rm -f "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
            fi
            exit "${status}"
          }
          trap cleanup_failed_import EXIT

          rm -f "${certificate}" "${DEVELOPER_ID_KEYCHAIN}"
          python3 - "${certificate}" <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys

          encoded_certificate = "".join(
              os.environ["DEVELOPER_ID_APPLICATION_P12_BASE64"].split()
          )
          Path(sys.argv[1]).write_bytes(
              base64.b64decode(encoded_certificate, validate=True)
          )
          PY
          chmod 600 "${certificate}"

          security create-keychain -p "${keychain_password}" "${DEVELOPER_ID_KEYCHAIN}"
          security set-keychain-settings -lut 14400 "${DEVELOPER_ID_KEYCHAIN}"
          security unlock-keychain -p "${keychain_password}" "${DEVELOPER_ID_KEYCHAIN}"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            > "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
          original_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -n "${keychain}" ]] && original_keychains+=("${keychain}")
          done < "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
          security list-keychains \
            -d user \
            -s "${DEVELOPER_ID_KEYCHAIN}" "${original_keychains[@]}"
          security import "${certificate}" \
            -k "${DEVELOPER_ID_KEYCHAIN}" \
            -P "${DEVELOPER_ID_APPLICATION_P12_PASSWORD}" \
            -f pkcs12 \
            -x \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${DEVELOPER_ID_KEYCHAIN}"

          identities="$(
            security find-identity -v -p codesigning "${DEVELOPER_ID_KEYCHAIN}" \
              | grep 'Developer ID Application:' || true
          )"
          identity_count="$(grep -c . <<<"${identities}" || true)"
          if [[ "${identity_count}" != "1" ]]; then
            printf 'expected exactly one valid Developer ID Application identity, found %s\n' \
              "${identity_count}" >&2
            exit 1
          fi
          identity="$(awk '{print $2}' <<<"${identities}")"
          if [[ ! "${identity}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            printf 'Developer ID Application identity fingerprint is invalid.\n' >&2
            exit 1
          fi
          security find-certificate \
            -c 'Developer ID Application' \
            -p "${DEVELOPER_ID_KEYCHAIN}" \
            | openssl x509 -checkend 86400 -noout

          cp /usr/bin/true "${signing_probe}"
          codesign \
            --force \
            --keychain "${DEVELOPER_ID_KEYCHAIN}" \
            --sign "${identity}" \
            --timestamp \
            --options runtime \
            "${signing_probe}"
          codesign --verify --strict --verbose=2 "${signing_probe}"

          rm -f "${certificate}" "${signing_probe}"
          trap - EXIT
          {
            printf 'DEVELOPER_ID_APPLICATION_IDENTITY=%s\n' "${identity}"
            printf 'DEVELOPER_ID_KEYCHAIN=%s\n' "${DEVELOPER_ID_KEYCHAIN}"
          } >> "${GITHUB_ENV}"

      - name: Build package
        env:
          CONTAINER_SERVICE_WORKLOADS_PREBUILT: "true"
        run: |
          make package \
            BUILD_CONFIGURATION="${{ steps.lane.outputs.configuration }}" \
            HOMEBREW_ARCHIVE="${RUNNER_TEMP}/${{ steps.lane.outputs.asset }}" \
            CODESIGN_OPTS="--force --keychain ${DEVELOPER_ID_KEYCHAIN} --sign ${DEVELOPER_ID_APPLICATION_IDENTITY} --timestamp --options runtime"

      - name: Verify Developer ID signed package
        run: scripts/verify-developer-id-archive.sh "${RUNNER_TEMP}/${{ steps.lane.outputs.asset }}"

      - name: Remove Developer ID signing keychain
        if: always()
        env:
          DEVELOPER_ID_KEYCHAIN: ${{ runner.temp }}/container-developer-id-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
          DEVELOPER_ID_ORIGINAL_KEYCHAINS: ${{ runner.temp }}/container-developer-id-${{ github.run_id }}-${{ github.run_attempt }}.keychains
        shell: bash
        run: |
          set -euo pipefail
          restore_status=0
          original_keychains=()
          if [[ -f "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}" ]]; then
            while IFS= read -r keychain; do
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              [[ -n "${keychain}" ]] && original_keychains+=("${keychain}")
            done < "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
            if ((${#original_keychains[@]} > 0)); then
              security list-keychains -d user -s "${original_keychains[@]}" \
                || restore_status="$?"
            else
              security list-keychains -d user -s || restore_status="$?"
            fi
          fi
          security delete-keychain "${DEVELOPER_ID_KEYCHAIN}" >/dev/null 2>&1 || true
          rm -f "${DEVELOPER_ID_KEYCHAIN}" "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}"
          exit "${restore_status}"

      - name: Attest package
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/${{ steps.lane.outputs.asset }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.lane.outputs.asset }}
          path: |
            ${{ runner.temp }}/${{ steps.lane.outputs.asset }}
            ${{ runner.temp }}/${{ steps.lane.outputs.asset }}.sha256

      - name: Publish branch release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.lane.outputs.asset }}
          CONFIGURATION: ${{ steps.lane.outputs.configuration }}
          RELEASE_NAME: ${{ steps.lane.outputs.release_name }}
          RELEASE_TAG: ${{ steps.lane.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_target="$(
            git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}" \
              | awk '{print $1}' \
              | tail -n 1
          )"
          if [[ -n "$tag_target" && "$tag_target" != "$GITHUB_SHA" ]]; then
            printf 'release tag %s already points at %s, refusing to retarget it to %s\n' \
              "$RELEASE_TAG" "$tag_target" "$GITHUB_SHA" >&2
            exit 1
          fi

          notes="$(mktemp)"
          generated_notes="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$generated_notes"

          {
            printf '%s\n\n' "${RELEASE_NAME}"
            printf 'Branch: %s\n' "${GITHUB_REF_NAME}"
            printf 'Commit: %s\n' "${GITHUB_SHA}"
            printf 'Build configuration: %s\n\n' "${CONFIGURATION}"
            cat "$generated_notes"
          } > "$notes"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "${RELEASE_NAME}" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release edit "$RELEASE_TAG" \
              --title "${RELEASE_NAME}" \
              --notes-file "$notes" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            "${RUNNER_TEMP}/${ASSET}" \
            "${RUNNER_TEMP}/${ASSET}.sha256" \
            --clobber

      - name: Check Homebrew tap token
        if: steps.lane.outputs.promote_to_tap == 'true'
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            printf 'HOMEBREW_TAP_TOKEN is not set; skipping stephenlclarke/homebrew-tap update.\n'
            exit 0
          fi
          printf 'available=true\n' >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        if: steps.tap-token.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: stephenlclarke/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew tap formula
        if: steps.tap-token.outputs.available == 'true'
        env:
          ASSET: ${{ steps.lane.outputs.asset }}
          FORMULA: ${{ steps.lane.outputs.formula }}
          FORMULA_CLASS: ${{ steps.lane.outputs.formula_class }}
          LABEL: ${{ steps.lane.outputs.label }}
          RELEASE_TAG: ${{ steps.lane.outputs.tag }}
          VERSION: ${{ steps.lane.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/stephenlclarke/container/releases/download/${RELEASE_TAG}/${ASSET}"
          sha256="$(awk '{print $1}' "${RUNNER_TEMP}/${ASSET}.sha256")"
          python3 scripts/update-homebrew-formula.py \
            --formula "homebrew-tap/Formula/${FORMULA}" \
            --template "Formula/container.rb" \
            --formula-class "$FORMULA_CLASS" \
            --url "$url" \
            --sha256 "$sha256" \
            --version "$VERSION" \
            --label "$LABEL" \
            --asset "$ASSET"
          git -C homebrew-tap diff -- Formula

      - name: Commit Homebrew tap update
        if: steps.tap-token.outputs.available == 'true'
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula; then
            printf 'Homebrew tap formula already points at %s\n' "${{ steps.lane.outputs.asset }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${{ steps.lane.outputs.formula }}"
          git commit -m "chore(homebrew): update ${{ github.ref_name }} container formula"
          git push
